play_tts:
  name: Play TTS
  description: >-
    Speak a text announcement on a MiYue speaker. On the Linux firmware the
    announce volume persists (playback resumes at that volume).
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    message:
      name: Message
      description: Text to speak (plain text, one sentence works best).
      required: true
      example: 晚饭好了
      selector:
        text:
    volume:
      name: Volume
      description: >-
        Announce volume (1-100). Leave empty to announce at each speaker's own
        current volume (recommended — the speaker keeps its volume unchanged).
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    announce_group:
      name: Announce to whole group
      description: If the speaker is grouped, speak on every member.
      default: true
      selector:
        boolean:
