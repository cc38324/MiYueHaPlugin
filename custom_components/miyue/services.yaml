play_tts:
  name: Play TTS
  description: >-
    Speak a text announcement on a MiYue speaker. On the Linux firmware the
    announce volume persists (playback resumes at that volume).
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    message:
      name: Message
      description: Text to speak (plain text, one sentence works best).
      required: true
      example: 晚饭好了
      selector:
        text:
    volume:
      name: Volume
      description: >-
        Announce volume (1-100). Leave empty to announce at each speaker's own
        current volume (recommended — the speaker keeps its volume unchanged).
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    announce_group:
      name: Announce to whole group
      description: If the speaker is grouped, speak on every member.
      default: true
      selector:
        boolean:

create_alarm:
  name: Create alarm
  description: Create an alarm on a MiYue speaker.
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    time:
      name: Time
      description: Alarm time, 24h HH:MM.
      required: true
      example: "07:30"
      selector:
        time:
    days:
      name: Days
      description: Days to repeat. Omit for every day.
      selector:
        select:
          multiple: true
          options:
            - { value: mon, label: Monday }
            - { value: tue, label: Tuesday }
            - { value: wed, label: Wednesday }
            - { value: thu, label: Thursday }
            - { value: fri, label: Friday }
            - { value: sat, label: Saturday }
            - { value: sun, label: Sunday }
    volume:
      name: Volume
      default: 50
      selector:
        number: { min: 1, max: 100, mode: slider }
    duration:
      name: Auto-stop (minutes)
      description: Pause the music this many minutes after the alarm starts. 0 = keep playing.
      default: 0
      selector:
        number: { min: 0, max: 240, mode: box }
    songlist_id:
      name: Songlist id
      description: >-
        Device songlist id to play. Find it in the media browser (歌单) or in an
        existing alarm switch's songlistInfoId attribute. Omit for TTS-only.
      selector:
        text:
    tts_text:
      name: Spoken text
      description: Optional text spoken before/instead of music.
      selector:
        text:
    enabled:
      name: Enabled
      default: true
      selector:
        boolean:

delete_alarm:
  name: Delete alarm
  description: >-
    Delete an alarm by its id. The id is shown as the alarm_id attribute of the
    alarm's switch entity (and in its name, e.g. "闹钟 07:30 #3").
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    alarm_id:
      name: Alarm id
      required: true
      selector:
        text:

create_scene:
  name: Create scene
  description: Create a device scene (情景) that can be run from a button.
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    name:
      name: Name
      required: true
      example: 观影模式
      selector:
        text:
    songlist_id:
      name: Songlist id
      description: Device songlist to play when the scene runs.
      selector:
        text:
    volume:
      name: Volume
      default: 30
      selector:
        number: { min: 1, max: 100, mode: slider }
    tts_text:
      name: Spoken text
      selector:
        text:
    cmd:
      name: Trigger code
      description: Optional unique trigger code (KNX/RS-485/custom). Auto-generated if omitted.
      selector:
        text:

delete_scene:
  name: Delete scene
  description: >-
    Delete a scene by its id. The id is shown as the scene_id attribute of the
    scene's button entity.
  target:
    entity:
      integration: miyue
      domain: media_player
  fields:
    scene_id:
      name: Scene id
      required: true
      selector:
        text:
